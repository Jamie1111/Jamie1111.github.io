<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/site.css" />
    <title>FakeBuzz - Your Daily Dose of Fake News and Fun</title>
</head>

<body>
    <header class="lobster-regular">
        <h1>FakeBuzz</h1>
        <p>Your Daily Dose of Fake News and Fun</p>
    </header>

    <article>
        <div class="input-container">
            
            <select id="user-select" class="control suse-regular">
                <option value="EcoFashionista">EcoFashionista</option>
                <option value="InspireMe">InspireMe</option>
                <option value="TechSocks">TechSocks</option>
                <option value="MusicMaestro">MusicMaestro</option>
            </select>
            
            <textarea id="new-feed-textarea" class="control suse-regular" placeholder="What's on your mind?" rows="4"></textarea>
            <div  id="new-feed-textarea-error" class="alert error hidden">
                Oops! It looks like you forgot to add some text. We'd love to hear what’s on your mind, so go ahead and type something!
            </div>

            <button id="post-feedbtn" class="btn suse-regular">Post</button>
        </div>

        <div id="feed-container" class="suse-regular">
            <!-- Feed items will be injected here by JavaScript -->
        </div>
        
        <div class="sidebar suse-regular">
            <h2>Feed Statistics</h2>
            <div class="stat">Total Posts: <span id="total-posts">0</span></div>
            <h2>Top 3 hashtags</h2>
            <div class="stat">
                <ul class="trending" id="trending"></ul>
            </div>
        </div>
    </article>

    <script src="./assets/js/feed.js"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
